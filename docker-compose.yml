services:
  db:
    image: postgres:16-alpine
    container_name: nail-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - nail_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - nail-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nail-academy-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      DEBUG_SESSION: ${DEBUG_SESSION:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:39010}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # код монтируется для hot-reload
      - ./:/app
      # node_modules внутри контейнера (чтобы линукс-бинари prisma не затёрлись)
      - nail_node_modules:/app/node_modules
      - nail_next_cache:/app/.next
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    networks:
      - nail-net

volumes:
  nail_db_data:
  nail_node_modules:
  nail_next_cache:

networks:
  nail-net:
    driver: bridge
